# Пайплайн CI/CD: валидация → сборка образов в GHCR → деплой через Ansible.
#
# Секреты GitHub Actions (Settings → Secrets and variables → Actions):
#   SSH_PRIVATE_KEY        — приватный SSH-ключ для доступа к VPS (PEM или base64)
#   ANSIBLE_VAULT_PASSWORD — пароль для расшифровки deploy/ansible/vault.yml
#   DEPLOY_USER            — (опционально) логин для ghcr.io на VPS, по умолчанию github.actor
#   DEPLOY_TOKEN           — (опционально) PAT с правом read:packages, по умолчанию GITHUB_TOKEN

name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_HOST: "ghcr.io"

jobs:
  # -------------------------------------------------------------------------
  # 1. Валидация: линтинг (gofmt, go vet), тесты, покрытие и компиляция
  # -------------------------------------------------------------------------
  validate-backend:
    name: validate backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: dommax
          POSTGRES_PASSWORD: dommax
          POSTGRES_DB: dommax
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dommax -d dommax"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: gofmt
        run: |
          test -z "$(gofmt -l cmd internal)" || (echo "Unformatted code detected:" && gofmt -l cmd internal && exit 1)

      - name: go vet
        run: go vet ./...

      - name: go test (unit)
        run: go test -race -count=1 ./...

      - name: go test (integration & coverage)
        env:
          DATABASE_URL: postgres://dommax:dommax@localhost:5432/dommax?sslmode=disable
        run: go test -v -tags integration -count=1 -coverpkg=./internal/... -coverprofile=coverage.out ./...

      - name: go build
        run: CGO_ENABLED=0 go build -v ./...

      - name: upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out
          retention-days: 7

  validate-miniapp:
    name: validate miniapp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: miniapp/package-lock.json

      - name: npm ci, typecheck, test, build
        working-directory: miniapp
        run: |
          npm ci
          npm run typecheck
          npm run test:cover
          npm run build

  # -------------------------------------------------------------------------
  # 2. Сборка и публикация Docker-образов в GitHub Container Registry (GHCR)
  # -------------------------------------------------------------------------
  build:
    name: build images
    needs: [validate-backend, validate-miniapp]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login "${{ env.REGISTRY_HOST }}" -u "${{ github.actor }}" --password-stdin

      - name: Build and push API & Web images
        run: |
          IMAGE_BASE=$(echo "${{ env.REGISTRY_HOST }}/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHA_TAG="${GITHUB_SHA::8}"

          echo "Building API image: ${IMAGE_BASE}/api:${SHA_TAG} and ${IMAGE_BASE}/api:latest"
          docker pull "${IMAGE_BASE}/api:latest" || true
          docker build \
            --cache-from "${IMAGE_BASE}/api:latest" \
            -t "${IMAGE_BASE}/api:${SHA_TAG}" \
            -t "${IMAGE_BASE}/api:latest" \
            ./backend
          docker push "${IMAGE_BASE}/api:${SHA_TAG}"
          docker push "${IMAGE_BASE}/api:latest"

          echo "Building Web image: ${IMAGE_BASE}/web:${SHA_TAG} and ${IMAGE_BASE}/web:latest"
          docker pull "${IMAGE_BASE}/web:latest" || true
          docker build \
            --cache-from "${IMAGE_BASE}/web:latest" \
            -f deploy/web.Dockerfile \
            -t "${IMAGE_BASE}/web:${SHA_TAG}" \
            -t "${IMAGE_BASE}/web:latest" \
            .
          docker push "${IMAGE_BASE}/web:${SHA_TAG}"
          docker push "${IMAGE_BASE}/web:latest"

  # -------------------------------------------------------------------------
  # 3. Деплой через Ansible Playbook
  # -------------------------------------------------------------------------
  deploy:
    name: deploy via ansible
    needs: [build]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      ANSIBLE_HOST_KEY_CHECKING: "False"
      DEPLOY_ENV: "prod"
    steps:
      - uses: actions/checkout@v4

      - name: Check SSH secret
        id: secrets
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: echo "ready=$([ -n "$SSH_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Install OpenSSH and Ansible
        if: steps.secrets.outputs.ready == 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends openssh-client
          pip install --no-cache-dir ansible-core

      - name: Prepare SSH key and Ansible Vault
        if: steps.secrets.outputs.ready == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          chmod 755 deploy/ansible
          mkdir -p ~/.ssh
          if echo "$SSH_PRIVATE_KEY" | grep -q "BEGIN"; then
            echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          else
            echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_rsa
          fi
          chmod 600 ~/.ssh/id_rsa

          if [ -n "$ANSIBLE_VAULT_PASSWORD" ]; then
            printf '%s' "$ANSIBLE_VAULT_PASSWORD" > deploy/ansible/.vault-pass
            chmod 600 deploy/ansible/.vault-pass
          fi

      - name: Run Ansible Playbook
        if: steps.secrets.outputs.ready == 'true'
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/deploy/ansible/ansible.cfg
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd deploy/ansible
          IMAGE_BASE=$(echo "${{ env.REGISTRY_HOST }}/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHA_TAG="${GITHUB_SHA::8}"

          if [ -f .vault-pass ]; then
            VAULT_ARG="--vault-password-file .vault-pass"
          else
            VAULT_ARG=""
          fi

          ansible-playbook \
            -i "localhost," \
            playbook.yml \
            ${VAULT_ARG} \
            -e "deploy_environment=${DEPLOY_ENV}" \
            -e "release_registry=${IMAGE_BASE}" \
            -e "registry_host=${{ env.REGISTRY_HOST }}" \
            -e "registry_username=${DEPLOY_USER:-${{ github.actor }}}" \
            -e "registry_token=${DEPLOY_TOKEN:-${FALLBACK_TOKEN}}" \
            -e "image_tag=${SHA_TAG}"

      - name: Clean up sensitive files
        if: always()
        run: |
          rm -f deploy/ansible/.vault-pass ~/.ssh/id_rsa

      - name: Deploy skipped notice
        if: steps.secrets.outputs.ready != 'true'
        run: echo "::notice::Секрет SSH_PRIVATE_KEY не задан, шаг деплоя пропущен."
