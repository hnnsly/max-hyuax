---
- name: Add Target Host Dynamically
  hosts: localhost
  gather_facts: false
  vars_files:
    - vault.yml
  vars:
    env_config: "{{ lookup('ansible.builtin.vars', deploy_environment | default('prod')) }}"
  tasks:
    - name: Validate deploy environment configuration
      ansible.builtin.assert:
        that:
          - env_config is defined
          - env_config.deploy_host is defined
        fail_msg: "Configuration for environment '{{ deploy_environment }}' not found in vault.yml"

    - name: Add target host from configuration
      ansible.builtin.add_host:
        name: target_server
        ansible_host: "{{ env_config.deploy_host }}"
        ansible_user: "{{ env_config.deploy_user | default('ansible') }}"
        ansible_port: "{{ env_config.deploy_port | default(22) }}"

- name: Execute Deployment on Target Host
  hosts: target_server
  gather_facts: false
  vars_files:
    - vault.yml
  vars:
    env_config: "{{ lookup('ansible.builtin.vars', deploy_environment | default('prod')) }}"
    target_deploy_path: "{{ env_config.deploy_path | default('/opt/max') }}"
  tasks:
    - name: Ensure deployment directory exists
      ansible.builtin.file:
        path: "{{ target_deploy_path }}"
        state: directory
        mode: '0755'

    - name: Log in to container registry
      ansible.builtin.shell: |
        echo "{{ registry_token }}" | docker login "{{ registry_host }}" -u "{{ registry_username }}" --password-stdin
      args:
        executable: /bin/bash
      no_log: false
      changed_when: false
      when: (registry_token | default('') | length) > 0

    - name: Write docker-compose.yml
      ansible.builtin.template:
        src: templates/docker-compose.yml.j2
        dest: "{{ target_deploy_path }}/docker-compose.yml"
        mode: '0600'

    - name: Pull container images
      ansible.builtin.shell: |
        docker compose pull
      args:
        chdir: "{{ target_deploy_path }}"
        executable: /bin/bash
      changed_when: true

    - name: Start services via Docker Compose
      ansible.builtin.shell: |
        docker compose up -d --remove-orphans
      args:
        chdir: "{{ target_deploy_path }}"
        executable: /bin/bash
      changed_when: true

    - name: Clean up unused docker images
      ansible.builtin.shell: |
        docker image prune -f
      args:
        executable: /bin/bash
      changed_when: false

    - name: Check container status
      ansible.builtin.shell: |
        docker compose ps
      args:
        chdir: "{{ target_deploy_path }}"
        executable: /bin/bash
      changed_when: false
