name: dom-max

services:
  web:
    # Caddy с собранным мини-приложением внутри образа (deploy/web.Dockerfile).
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env or pass --env-file deploy/.env.example}
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  db:
    # Версия закреплена явно; обновлять осознанно, а не через latest.
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: dommax
      POSTGRES_DB: dommax
      # На сервере задать свой пароль в deploy/.env. Наружу порт открыт только на 127.0.0.1.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dommax}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      # С Postgres 18 образ хранит данные в /var/lib/postgresql/<версия>, том монтируется на уровень выше.
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dommax -d dommax"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    # Фото к заявкам в S3-совместимом хранилище (ADR-018). Официальные образы MinIO больше не публикуются,
    # это сборка из исходников последнего релиза с исправлением безопасности 10.2025, тег закреплён.
    image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      # На сервере задать свои значения в deploy/.env.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dommax}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dommax-local-only}
    # Наружу только на 127.0.0.1 для task s3 и консоли; api ходит в MinIO внутри сети compose.
    ports:
      - "127.0.0.1:${S3_PORT:-19000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    # Порт наружу не публикуется: запросы приходят через Caddy (/api/*, /webhook/*).
    environment:
      DATABASE_URL: postgres://dommax:${POSTGRES_PASSWORD:-dommax}@db:5432/dommax?sslmode=disable
      HTTP_ADDR: ":8080"
      # Пустые значения проверяет сам api при старте и пишет понятную ошибку в лог.
      SESSION_SECRET: ${SESSION_SECRET:-}
      DEMO_AUTH_ENABLED: ${DEMO_AUTH_ENABLED:-false}
      BOT_MODE: ${BOT_MODE:-off}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-}
      DOMAIN: ${DOMAIN:-}
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-dommax}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-dommax-local-only}
      S3_BUCKET: photos
      # Геокодер на данных OpenStreetMap (ADR-016). Пусто — импорт и «Найти дома рядом» без него.
      GEOCODER_URL: ${GEOCODER_URL:-}
      GEOCODER_USER_AGENT: ${GEOCODER_USER_AGENT:-dom-max/1.0}
      # Подсказка категории через LLM (профиль llm). Пусто — только ключевые слова.
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}

  ollama:
    # Self-hosted модель для подсказки категории (ADR-008). Запускается только с профилем llm.
    image: ollama/ollama:0.34.3
    profiles: [llm]
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  ollama-pull:
    # Скачивает модель один раз при первом запуске, а не при сборке: сборка остаётся быстрой.
    image: ollama/ollama:0.34.3
    profiles: [llm]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${OLLAMA_MODEL:-qwen3:4b}"]
    restart: "no"

volumes:
  minio_data:
  ollama_models:
  caddy_data:
  caddy_config:
  pg_data:
